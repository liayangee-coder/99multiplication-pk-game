.stage::before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0a74e329 0%,transparent 45%,#fa465a29 100%);pointer-events:none}
.stage-top{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:11px;padding:10px 12px 0;flex-wrap:wrap;font-weight:850}
.stage-chip{border:1px solid #ffe7a6aa;border-radius:40px;background:#130f33ad;color:#ffe98e;padding:5px 13px;font-size:clamp(12px,1.45vw,16px);text-align:center}
.stage-main{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(105px,190px) minmax(0,1fr);align-items:center;gap:6px;padding:8px clamp(10px,1.8vw,26px) 14px;min-height:183px}
.fighter{display:flex;align-items:center;gap:clamp(7px,2.3vw,30px);min-width:0}.fighter.right{flex-direction:row-reverse;text-align:right}
.avatar{width:clamp(70px,10vw,133px);height:clamp(70px,10vw,133px);flex:none;border-radius:50%;overflow:hidden;border:5px solid #6ad4ff;box-shadow:0 0 0 4px #1a3dab,0 0 28px #32d4ffac;background:#1158a1;position:relative}
.avatar.red{border-color:#ffb267;box-shadow:0 0 0 4px #cb3d39,0 0 28px #ff733da8;background:#953b29}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center top}
.team-info{min-width:0}.team-name{font-size:clamp(18px,2.1vw,29px);font-weight:1000;text-shadow:0 3px 0 #102a63;letter-spacing:.02em;white-space:nowrap}.fighter.right .team-name{text-shadow:0 3px 0 #752331}
.score-number{font-size:clamp(33px,5vw,77px);line-height:1;font-weight:1000;font-variant-numeric:tabular-nums;color:#fefefe;text-shadow:0 5px 0 #1e3e9a,0 0 19px #71ddff8f;white-space:nowrap;margin:5px 0}
.fighter.right .score-number{text-shadow:0 5px 0 #a53647,0 0 19px #ffac7c9c}
.streak{font-size:clamp(12px,1.4vw,18px);font-weight:900;color:#ffefa5;white-space:nowrap}
.versus{display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;white-space:nowrap}.vs{font-size:clamp(37px,5.4vw,79px);font-weight:1000;line-height:1.05;font-style:italic;color:#fff1a5;-webkit-text-stroke:1.5px #d8583b;text-shadow:0 5px 0 #6930a0,0 0 24px #ffe255}
.round{font-size:clamp(12px,1.4vw,17px);font-weight:900;color:#fff}.clock{font-size:clamp(21px,2.7vw,37px);font-weight:1000;color:#fff;border-radius:13px;padding:2px 12px;background:#0e163bce;border:2px solid #ffe175;box-shadow:0 3px 0 #bb7226;font-variant-numeric:tabular-nums}
.clock.urgent{background:#a32646;animation:pulse .55s infinite alternate}
.warline-wrap{position:relative;z-index:1;padding:0 26px 16px}.warline{height:20px;border:3px solid #fff4bb;background:#2789ed;border-radius:30px;overflow:hidden;position:relative;box-shadow:0 2px 0 #6a2249}.warred{height:100%;width:50%;background:linear-gradient(90deg,#f1325e,#ffae66);transition:width .5s ease;position:relative}.warline-labels{display:flex;justify-content:space-between;font-size:12px;color:#eaf4ff;font-weight:850;margin-top:5px}.war-marker{position:absolute;left:50%;transform:translateX(-50%);top:-6px;font-size:23px;line-height:25px;text-shadow:0 0 10px #ffec71;transition:left .5s ease}
.question-box{border-radius:23px;margin:17px 0 14px;text-align:center;padding:10px 14px 13px;position:relative;border:3px solid #ffe18b;background:linear-gradient(110deg,#633cbd 0%,#342d84 33%,#202a79 66%,#ad3a8d 100%);box-shadow:0 6px 0 #150c40,0 0 30px #af80ff39;overflow:hidden}
.question-box::before,.question-box::after{position:absolute;content:'✦';font-size:30px;color:#fff3ae;opacity:.8;top:22px}.question-box::before{left:4%}.question-box::after{right:4%}
.qmeta{font-size:clamp(12px,1.35vw,17px);font-weight:900;color:#ffe38a;letter-spacing:.08em}.equation{font-size:clamp(45px,6.5vw,100px);line-height:1.12;font-weight:1000;color:#fff;text-shadow:0 5px 0 #5d3c9a,0 0 14px #ffffff48;font-variant-numeric:tabular-nums;letter-spacing:.02em;word-break:break-word}
.feedback{font-size:clamp(12px,1.3vw,16px);font-weight:800;min-height:22px;color:#f7f3ff}
.arena{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(8px,1.65vw,23px)}
.play-panel{border-radius:23px;border:4px solid #52d3fa;background:linear-gradient(148deg,#236bd7 0%,#143879 88%);box-shadow:0 8px 0 #092457,0 0 19px #2898ff38;padding:14px clamp(9px,1.7vw,24px) 12px;min-width:0;position:relative;overflow:hidden}
.play-panel.red{border-color:#ff966d;background:linear-gradient(148deg,#f65e6c 0%,#9c2058 90%);box-shadow:0 8px 0 #67143c,0 0 19px #ff638039}
.play-panel::before{content:'';position:absolute;inset:0;opacity:.09;background:radial-gradient(circle at 80% -10%,white 5%,transparent 60%);pointer-events:none}
.panel-title{font-size:clamp(17px,2.15vw,29px);font-weight:1000;text-align:center;margin:0 0 13px;color:#fff;text-shadow:0 3px 0 #1b3586}.play-panel.red .panel-title{text-shadow:0 3px 0 #971e43}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(8px,1.2vw,15px)}
.option{border-radius:18px;min-height:clamp(65px,8vw,109px);padding:8px 7px;background:linear-gradient(175deg,#fffefa,#e4ebff);border:3px solid #b5eaff;color:#102b66;display:flex;align-items:center;justify-content:center;gap:clamp(5px,1.1vw,14px);font-size:clamp(23px,3.4vw,47px);font-weight:1000;box-shadow:0 5px 0 #215595;transition:transform .12s,background-color .12s;position:relative;min-width:0;overflow:hidden}
.play-panel.red .option{border-color:#ffd0bd;color:#7c1e3d;box-shadow:0 5px 0 #842343}
.option:not(:disabled):hover{background:#fff5a4;transform:translateY(-2px)}.option:disabled{opacity:.76}.option:disabled.placeholder{opacity:.82;background:#ffffffbd}

.option.correct,.play-panel.red .option.correct{opacity:1;background:linear-gradient(#caffb4,#6be98d);border-color:#e2ffe4;color:#0e5b28;box-shadow:0 5px 0 #21803a}
.option.wrong,.play-panel.red .option.wrong{opacity:1;background:#ffb3bc;border-color:#fff1ee;color:#7a142f;box-shadow:0 5px 0 #93283b}
.option.correct .letter{background:#159446;border-color:#93ffb2;box-shadow:none}.option.wrong .letter{background:#b51f42;border-color:#f981a2;box-shadow:none}
.option.selected{outline:4px solid #fff781;outline-offset:-5px;opacity:1}
.status{padding:10px 4px 0;text-align:center;min-height:38px;font-size:clamp(13px,1.5vw,19px);font-weight:950;color:#fff6d1}
.notes{margin:17px 4px 0;font-size:12px;line-height:1.65;color:#c9d5ff;text-align:center}

.modal h2{margin:0 0 14px;color:#383084;font-size:clamp(24px,3vw,36px)}.modal h3{margin-bottom:8px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.summary-card{border-radius:13px;padding:15px;background:#e1efff;border:2px solid #3da2f4;font-weight:800}.summary-card.red{background:#fff0ef;border-color:#e66c86}.summary-card strong{font-size:25px}.modal .missed{margin:6px 0;padding-left:24px;line-height:1.8;max-height:220px;overflow:auto}.modal button{min-height:46px;border-radius:12px;background:#463aad;color:#fff;padding:10px 24px;font-weight:900}.modal-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.modal button.replay{background:#e66e37}
.celebrate{position:fixed;inset:0;z-index:12;pointer-events:none;overflow:hidden}.confetti{position:absolute;top:-20px;width:10px;height:17px;border-radius:2px;animation:fall 1.55s linear forwards}
.pop{animation:bounce .5s ease-out}.score-pop{position:absolute;z-index:2;bottom:5px;left:50%;transform:translateX(-50%);font-size:clamp(16px,2vw,28px);font-weight:1000;color:#ffe657;text-shadow:0 2px 2px #1a1740;animation:upFade 1.1s ease forwards;white-space:nowrap;pointer-events:none}

<section class="question-box" aria-label="本回合乘法題目"><div class="qmeta" id="questionMeta">✨ 選擇關卡，按下「開始對戰」 ✨</div><div class="equation" id="equation">? × ? = ?</div><div class="feedback" id="message" aria-live="polite">兩隊答對 +100 分｜速度 +20｜每連對 3 題 +30</div></section>
<main class="arena"><section class="play-panel red" id="redPanel" aria-label="紅隊答案選項"><h2 class="panel-title">🔥 紅隊作答區</h2><div class="choices" id="redOptions"><button type="button" class="option placeholder" disabled><span class="letter">A</span>❔</button><button type="button" class="option placeholder" disabled><span class="letter">B</span>❔</button><button type="button" class="option placeholder" disabled><span class="letter">C</span>❔</button><button type="button" class="option placeholder" disabled><span class="letter">D</span>❔</button></div><div class="status" id="redStatus" aria-live="polite">一起全力以赴，爭取勝利！</div></section><section class="play-panel blue" id="bluePanel" aria-label="藍隊答案選項"><h2 class="panel-title">⚡ 藍隊作答區</h2><div class="choices" id="blueOptions"><button type="button" class="option placeholder" disabled><span class="letter">A</span>❔</button><button type="button" class="option placeholder" disabled><span class="letter">B</span>❔</button><button type="button" class="option placeholder" disabled><span class="letter">C</span>❔</button><button type="button" class="option placeholder" disabled><span class="letter">D</span>❔</button></div><div class="status" id="blueStatus" aria-live="polite">準備好迎接挑戰了嗎？</div></section></main>
<footer class="notes">同一題、左右兩隊各答一次；只能四選一。智慧黑板可觸控操作，也可使用滑鼠。本版單機離線可玩。</footer></div>
<div class="celebrate" id="celebrate" aria-hidden="true"></div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="modal"><h2 id="resultTitle">🏆 對戰統計</h2><div id="resultBody"></div><div class="modal-actions"><button id="closeResult" type="button">返回對戰</button><button id="replay" type="button" class="replay">🚀 同關再戰</button></div></div></div>
<script>
(()=>{'use strict';
const el=id=>document.getElementById(id);
const teamLabels={blue:'藍隊',red:'紅隊'};
const teams=['blue','red'];
const specs=[[2,9,2,9],[10,99,2,9],[10,99,10,99],[100,999,2,9],[100,999,10,99]];
const titles=['⭐ 第 1 關｜九九乘法','⭐⭐ 第 2 關｜二位數 × 一位數','⭐⭐⭐ 第 3 關｜二位數 × 二位數','🏅 第 4 關｜三位數 × 一位數','🏆 第 5 關｜三位數 × 二位數'];
let state='idle',level=0,total=15,limit=15,index=0,remaining=15,deadline=0,pausedRemaining=0,timer=null,q=null;
let used=new Set(),answers={},scores={blue:0,red:0},streak={blue:0,red:0},stats={blue:{correct:0,attempts:0},red:{correct:0,attempts:0}},history=[],roundResolved=false,modalResume=false,soundOn=false,audio=null,autoNextTimer=null;
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rand(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function number(n){return n.toLocaleString('zh-TW');}
function makeQuestion(){
 const [minA,maxA,minB,maxB]=specs[level];let a,b,key,tries=0;
 do{a=rand(minA,maxA);b=rand(minB,maxB);key=a+','+b;tries++;}while(used.has(key)&&tries<250);
 used.add(key);const correct=a*b;const options=new Set([correct]);
 const candidates=[(a-1)*b,(a+1)*b,a*(b-1),a*(b+1),correct-1,correct+1,correct-10,correct+10,correct-100,correct+100,correct-2,correct+2];
 shuffle(candidates).forEach(v=>{if(options.size<4&&v>0&&v!==correct)options.add(v);});
 let guard=0;while(options.size<4&&guard++<200){const span=Math.max(9,Math.round(correct*.15));const v=correct+rand(-span,span);if(v>0)options.add(v);}
 return {a,b,correct,options:shuffle(Array.from(options)),key};
}
function beep(kind){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;if(!audio)audio=new C();if(audio.state==='suspended')audio.resume();const freq=kind==='good'?660:kind==='wrong'?190:900;const o=audio.createOscillator(),g=audio.createGain();o.type=kind==='wrong'?'triangle':'sine';o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(100,freq*.7),audio.currentTime+.16);g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.19);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.2);}catch(e){/* Audio permission is optional. */}}
function confetti(n=26){if(window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;const box=el('celebrate');box.replaceChildren();const colors=['#4bc7ff','#fff06e','#fc6b91','#a9f781','#d68cff'];for(let i=0;i<n;i++){const bit=document.createElement('i');bit.className='confetti';bit.style.left=rand(2,97)+'%';bit.style.animationDelay=(Math.random()*.55)+'s';bit.style.background=colors[i%colors.length];bit.style.transform='rotate('+rand(-180,180)+'deg)';box.appendChild(bit);}setTimeout(()=>box.replaceChildren(),2400);}
function animateScore(t,points){const target=el(t+'Score');target.classList.remove('pop');void target.offsetWidth;target.classList.add('pop');const info=target.closest('.team-info');const previous=info.querySelector('.score-pop');if(previous)previous.remove();const p=document.createElement('span');p.className='score-pop';p.textContent='+'+points;info.style.position='relative';info.appendChild(p);setTimeout(()=>p.remove(),1200);}
function controls(){const live=['playing','paused','revealed'].includes(state);el('start').disabled=live;['level','seconds','count'].forEach(k=>el(k).disabled=live);el('pause').disabled=state!=='playing'&&state!=='paused';el('pause').textContent=state==='paused'?'▶ 繼續':'⏸ 暫停';el('next').disabled=state!=='revealed';el('next').textContent=index===total?'🏆 看結果':'➡ 下一題';el('clock').textContent=Math.ceil(remaining)+' 秒';el('clock').classList.toggle('urgent',state==='playing'&&remaining<=5);}
function scoreboard(){teams.forEach(t=>{el(t+'Score').textContent=number(scores[t]);el(t+'Streak').textContent='🔥 連對 '+streak[t]+' 題';});const sum=scores.blue+scores.red;const width=sum===0?50:(100*scores.red/sum);el('progress').style.width=width+'%';el('marker').style.left=width+'%';el('round').textContent=index?'第 '+index+' / '+total+' 題':'準備開戰';el('stageName').textContent=titles[level];}
function placeholders(){teams.forEach(t=>{const area=el(t+'Options');area.replaceChildren();for(let i=0;i<4;i++){const b=document.createElement('button');b.type='button';b.disabled=true;b.className='option placeholder';b.innerHTML='<span class="letter">'+ 'ABCD'[i]+'</span><span>❔</span>';area.appendChild(b);}});}
function renderOptions(){teams.forEach(t=>{const area=el(t+'Options');area.replaceChildren();q.options.forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.className='option';b.dataset.value=String(v);b.setAttribute('aria-label',teamLabels[t]+'選項 '+ 'ABCD'[i]+'：'+v);const tag=document.createElement('span');tag.className='letter';tag.textContent='ABCD'[i];const txt=document.createElement('span');txt.textContent=number(v);b.append(tag,txt);b.addEventListener('click',()=>choose(t,v));area.appendChild(b);});});}
function showQuestion(){clearAutoNext();q=makeQuestion();index++;roundResolved=false;answers={};remaining=limit;el('equation').textContent=number(q.a)+' × '+number(q.b)+' = ?';el('questionMeta').textContent='⚡ '+titles[level]+'｜第 '+index+' 題，共 '+total+' 題';el('message').textContent='🏁 兩隊同時挑戰！點選答案後不能修改。';teams.forEach(t=>el(t+'Status').textContent='🎯 快選出正確答案！');renderOptions();state='playing';scoreboard();deadline=performance.now()+limit*1000;clearInterval(timer);timer=setInterval(tick,100);controls();}
function tick(){if(state!=='playing')return;remaining=Math.max(0,(deadline-performance.now())/1000);el('clock').textContent=Math.ceil(remaining)+' 秒';el('clock').classList.toggle('urgent',remaining<=5);if(remaining<=0)resolve();}
function choose(t,value){if(state!=='playing'||answers[t])return;answers[t]={value,correct:value===q.correct,at:performance.now()};stats[t].attempts++;if(answers[t].correct){stats[t].correct++;beep('good');}else beep('wrong');el(t+'Status').textContent='✅ 已送出！等待本題結算';Array.from(el(t+'Options').children).forEach(btn=>{btn.disabled=true;if(Number(btn.dataset.value)===value)btn.classList.add('selected');});if(teams.every(k=>answers[k]))resolve();}
function clearAutoNext(){if(autoNextTimer!==null){clearTimeout(autoNextTimer);autoNextTimer=null;}}
function advance(){if(state!=='revealed')return;clearAutoNext();if(index>=total){state='ended';controls();openResults();}else showQuestion();}
function scheduleAutoNext(){clearAutoNext();autoNextTimer=setTimeout(()=>{autoNextTimer=null;advance();},index===total?2200:1600);}
function resolve(){if(roundResolved||state!=='playing')return;roundResolved=true;clearInterval(timer);remaining=Math.max(0,remaining);state='revealed';const right=teams.filter(t=>answers[t]?.correct);let quickest=null;
 if(right.length===1)quickest=right[0];else if(right.length===2){const gap=Math.abs(answers.blue.at-answers.red.at);if(gap>150)quickest=answers.blue.at<answers.red.at?'blue':'red';}
 teams.forEach(t=>{let gained=0;if(answers[t]?.correct){streak[t]++;gained+=100;if(quickest===t)gained+=20;if(streak[t]%3===0)gained+=30;scores[t]+=gained;animateScore(t,gained);}else streak[t]=0;el(t+'Status').textContent=answers[t]?(answers[t].correct?'🎉 答對了！真厲害！':'💡 再接再厲，繼續挑戰！'):'⌛ 時間到，本題未作答';Array.from(el(t+'Options').children).forEach(btn=>{btn.disabled=true;const v=Number(btn.dataset.value);if(v===q.correct)btn.classList.add('correct');else if(answers[t]?.value===v)btn.classList.add('wrong');});});
 history.push({a:q.a,b:q.b,correct:q.correct,blue:answers.blue?.value??null,red:answers.red?.value??null});
 el('message').textContent='🎯 正確答案：'+number(q.correct)+(quickest?'｜⚡ '+teamLabels[quickest]+'最快答對 +20 分！':'｜雙隊繼續加油！')+(answers.blue&&answers.red?(index===total?'｜即將公布戰績…':'｜即將自動下一題…'):'');scoreboard();controls();if(right.length===2)confetti(16);if(index===total){beep('finish');confetti(40);}if(answers.blue&&answers.red)scheduleAutoNext();}
function start(){clearAutoNext();clearInterval(timer);level=Number(el('level').value);total=Number(el('count').value);limit=Number(el('seconds').value);index=0;used=new Set();scores={blue:0,red:0};streak={blue:0,red:0};stats={blue:{correct:0,attempts:0},red:{correct:0,attempts:0}};history=[];el('overlay').classList.remove('open');showQuestion();}
function pause(){if(state==='playing'){pausedRemaining=Math.max(0,deadline-performance.now());remaining=pausedRemaining/1000;clearInterval(timer);state='paused';el('message').textContent='⏸ 已暫停，按「繼續」恢復計時';teams.forEach(t=>Array.from(el(t+'Options').children).forEach(b=>b.disabled=true));}else if(state==='paused'){deadline=performance.now()+pausedRemaining;state='playing';el('message').textContent='🚀 繼續作答！';teams.forEach(t=>{if(!answers[t])Array.from(el(t+'Options').children).forEach(b=>b.disabled=false);});clearInterval(timer);timer=setInterval(tick,100);}controls();}
function statsCard(t){const attempts=stats[t].attempts,correct=stats[t].correct;const pct=attempts?Math.round(100*correct/attempts):0;return '<div class="summary-card '+(t==='red'?'red':'')+'"><div>'+(t==='blue'?'🔵':'🔴')+' '+teamLabels[t]+'</div><strong>'+number(scores[t])+' 分</strong><div>答對 '+correct+' / '+attempts+' 題｜正確率 '+pct+'%</div></div>';}
function openResults(){clearAutoNext();modalResume=state==='playing';if(modalResume)pause();const finished=(index===total&&state==='revealed')||state==='ended';const name=scores.blue===scores.red?'🤝 雙隊平手':scores.blue>scores.red?'🔵 藍隊獲勝！':'🔴 紅隊獲勝！';el('resultTitle').textContent=finished?'🏆 '+name:'📊 目前對戰統計';const box=el('resultBody');box.replaceChildren();const desc=document.createElement('p');desc.textContent=titles[level]+'｜已完成 '+history.length+' / '+total+' 題';box.appendChild(desc);const grid=document.createElement('div');grid.className='summary-grid';grid.innerHTML=statsCard('blue')+statsCard('red');box.appendChild(grid);const misses=history.filter(h=>h.blue!==h.correct||h.red!==h.correct);const title=document.createElement('h3');title.textContent='📝 錯題與未作答回顧（'+misses.length+' 題）';box.appendChild(title);
 if(!misses.length){const p=document.createElement('p');p.textContent='目前沒有錯題，繼續保持！';box.appendChild(p);}else{const ol=document.createElement('ol');ol.className='missed';misses.forEach(h=>{const li=document.createElement('li');li.textContent=number(h.a)+' × '+number(h.b)+' = '+number(h.correct)+'｜藍隊：'+(h.blue===null?'未作答':number(h.blue))+'｜紅隊：'+(h.red===null?'未作答':number(h.red));ol.appendChild(li);});box.appendChild(ol);}
 el('overlay').classList.add('open');el('closeResult').focus();}
function closeResults(){el('overlay').classList.remove('open');if(modalResume&&state==='paused')pause();modalResume=false;}
function reset(ask=true){if(ask&&index>0&&!window.confirm('確定要清除本場戰績並重新設定嗎？'))return;clearAutoNext();clearInterval(timer);state='idle';index=0;remaining=Number(el('seconds').value);q=null;used=new Set();answers={};scores={blue:0,red:0};streak={blue:0,red:0};stats={blue:{correct:0,attempts:0},red:{correct:0,attempts:0}};history=[];modalResume=false;el('overlay').classList.remove('open');el('equation').textContent='? × ? = ?';el('questionMeta').textContent='✨ 選擇關卡，按下「開始對戰」 ✨';el('message').textContent='兩隊答對 +100 分｜速度 +20｜每連對 3 題 +30';el('blueStatus').textContent='準備好迎接挑戰了嗎？';el('redStatus').textContent='一起全力以赴，爭取勝利！';placeholders();scoreboard();controls();}
el('start').addEventListener('click',start);el('pause').addEventListener('click',pause);el('next').addEventListener('click',advance);el('results').addEventListener('click',openResults);el('closeResult').addEventListener('click',closeResults);el('replay').addEventListener('click',()=>{modalResume=false;start();});el('reset').addEventListener('click',()=>reset(true));el('seconds').addEventListener('change',()=>{if(state==='idle'){remaining=Number(el('seconds').value);controls();}});el('level').addEventListener('change',()=>{if(state==='idle'){level=Number(el('level').value);scoreboard();}});el('sound').addEventListener('click',()=>{soundOn=!soundOn;el('sound').textContent=soundOn?'🔊 音效開':'🔇 音效關';el('sound').setAttribute('aria-pressed',soundOn?'true':'false');if(soundOn)beep('good');});
el('overlay').addEventListener('click',e=>{if(e.target===el('overlay'))closeResults();});
// Basic copy deterrent, not source protection. Right-click is blocked; ordinary left-click remains supported.
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('cut',e=>e.preventDefault());document.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&['c','x','u','s','p'].includes(k))e.preventDefault();if(k==='f12')e.preventDefault();});
scoreboard();controls();
})();
</script>
